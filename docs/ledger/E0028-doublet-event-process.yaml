notes: 'First lab test of where the doublets fall; confirms a preliminary run outside the lab (18 Oct chat:
  gap CV 0.94, min gap 6, best L 215 at p 0.016 over 2000 placements, rune chi2 26.6, no line/page-start
  excess). The L 215 signal is the corpus-wide collision form (40 pairs vs 16.7 expected; 37 of the 40
  pairs cross a section break, 8 residues hold 3-4 doublets). PeriodColl was added to the family after
  seeing the preliminary, so its p is post hoc. It fails tier 2 (family p 0.09 > 0.01), and the step-7
  recheck kills it: column coincidence at L 215 is z -0.10 in the non-zero steps and 0.39 in the raw runes,
  against 11-95 for planted period-215 keys. It was not sent to the skeptic because it is below the
  family-wise ceiling. Strict rules, excluded by logic given the transcription: refractory R >= 7 (min gap
  6), one per printed line (3 lines hold 2), one per P-packet for P >= 15 at every section-aligned offset
  and P >= 19 at every page-aligned offset (results/E0028/strict_rules.txt). Still consistent:
  memoryless leaks, and a short refractory window R <= 6 (0 gaps <= 5 against ~2.6 expected; p 0.12, a
  hint only). Leak rate 86/446 = 0.19 of the random doublet rate. The memoryless verdict does not
  downgrade B08: positions chosen to encode numbers would look uniform to every statistic here.'
